name: Temporary AI context regeneration
on:
  push:
    branches:
      - arena-daowen-payment-20261015
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate context from current source files
        run: python sim/gen_ai_context.py
      - name: Emit generated context for retrieval
        run: |
          echo "BEGIN_GENERATED_AI_CONTEXT"
          cat AI_CONTEXT.md
          echo "END_GENERATED_AI_CONTEXT"
