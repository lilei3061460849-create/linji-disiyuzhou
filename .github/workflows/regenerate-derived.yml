name: Regenerate derived docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate derived documents from sources
        run: |
          python sim/gen_rules.py
          python sim/gen_daowen_index.py
          python sim/gen_ai_context.py
      - name: Commit generated outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "死者之书.md" "全道纹索引.md" "AI_CONTEXT.md"
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate derived rule indexes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
