name: Baseline Test Diagnosis

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Main baseline targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out unchanged main baseline
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run targeted tests on main baseline
        run: python -m pytest -q tests/test_ai_context.py tests/test_effect_chain_audit.py tests/test_guzhi_longlin_combo.py tests/test_jiahai_migration.py tests/test_longlin_migration.py tests/test_shuai_bai_migration.py tests/test_ziyu_migration.py tests/test_zui_ledger_migration.py
